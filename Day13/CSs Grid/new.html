<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Template</title>
    <style>
        .Container {
            border: 2px solid black;
            padding: 2px;
            display: grid;
            grid-template-areas: "nav nav nav" "side article article" "footer footer footer";
        }

        .item {
            border: 3px rgb(92, 202, 64) solid;
            height: 55px;
            /* width: 55px; */
        }

        .item1 {
            grid-area: nav;
            background-color: aqua;
        }

        .item2 {
            grid-area: side;
            background-color: blue;

        }

        .item3 {
            grid-area: article;
            background-color: blueviolet;
        }
        .item4{
            grid-area: footer;
            background-color: brown;
        }
        /* .item5{
            grid-area: item5;
            background-color: green;
        } */
    </style>
</head>

<body>
    <div class="Container">
        <div class="item item1">1</div>
        <div class="item item2">2</div>
        <div class="item item3">3</div>
        <div class="item item4">4</div>
        

    </div>
</body>

</html>
