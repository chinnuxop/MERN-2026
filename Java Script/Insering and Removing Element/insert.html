<!DOCTYPE html>
<html>
<head>
  <title>Insert Example</title>
</head>
<body>

  <h2>Insert Element Example</h2>

  <ul id="list">
    <li>Apple</li>
    <li>Mango</li>
  </ul>

  <button onclick="addItem()">Add Item</button>

  <script>
    function addItem() {

      // Create new li element
      let newItem = document.createElement("li");

      // Add text inside li
      newItem.innerText = "Banana";

      // Select ul
      let list = document.getElementById("list");

      // Insert li inside ul
      list.appendChild(newItem);
    }
  </script>

</body>
</html>
