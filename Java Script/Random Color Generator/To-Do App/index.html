<!DOCTYPE html>
<html>
<head>
  <title>Inline CSS To-Do App</title>
</head>

<body style="font-family: Arial; background-color: #f4f4f4; text-align: center;">

  <div style="background: white; width: 400px; margin: 50px auto; padding: 20px; border-radius: 10px; box-shadow: 0px 0px 10px gray;">
    
    <h2 style="color: #333;">To-Do List</h2>

    <input id="taskInput" type="text" placeholder="Enter task"
      style="padding: 10px; width: 70%; border: 1px solid #ccc; border-radius: 5px;">

    <button onclick="addTask()"
      style="padding: 10px; background: green; color: white; border: none; border-radius: 5px; cursor: pointer;">
      Add
    </button>

    <ul id="taskList" style="list-style: none; padding: 0; margin-top: 20px;"></ul>

  </div>

  <script>
    function addTask() {
      let input = document.getElementById("taskInput");
      let task = input.value.trim();

      if (task === "") {
        alert("Enter a task!");
        return;
      }

      let li = document.createElement("li");

      li.style = "background:#eee; margin:10px; padding:10px; border-radius:5px; display:flex; justify-content:space-between;";

      li.innerHTML = `
        <span onclick="toggleTask(this)" style="cursor:pointer;">${task}</span>
        <button onclick="deleteTask(this)" style="background:red; color:white; border:none; padding:5px 10px; border-radius:5px;">X</button>
      `;

      document.getElementById("taskList").appendChild(li);

      input.value = "";
    }

    function deleteTask(btn) {
      btn.parentElement.remove();
    }

    function toggleTask(span) {
      if (span.style.textDecoration === "line-through") {
        span.style.textDecoration = "none";
        span.style.color = "black";
      } else {
        span.style.textDecoration = "line-through";
        span.style.color = "gray";
      }
    }
  </script>

</body>
</html>
