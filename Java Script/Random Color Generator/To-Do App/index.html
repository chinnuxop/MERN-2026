<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Advanced To-Do App</title>

  <style>
 body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(135deg, #667eea, #764ba2);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}

.container {
  background: #ffffff;
  padding: 25px;
  width: 380px;
  border-radius: 15px;
  box-shadow: 0 15px 35px rgba(0,0,0,0.25);
  transition: transform 0.3s ease;
}

.container:hover {
  transform: translateY(-5px);
}

h2 {
  text-align: center;
  margin-bottom: 20px;
  color: #444;
}

input {
  width: 68%;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #ddd;
  outline: none;
  transition: 0.3s;
}

input:focus {
  border-color: #667eea;
  box-shadow: 0 0 5px rgba(102,126,234,0.5);
}

button {
  padding: 10px 12px;
  cursor: pointer;
  border: none;
  border-radius: 8px;
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: white;
  font-weight: bold;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.05);
  opacity: 0.95;
}

li {
  list-style: none;
  margin: 12px 0;
  padding: 10px;
  background: #f9f9f9;
  border-radius: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  transition: 0.3s;
}

li:hover {
  background: #f1f1f1;
}

.done {
  text-decoration: line-through;
  color: gray;
}

.actions button {
  margin-left: 6px;
  background: #eee;
  color: #333;
  padding: 6px 8px;
  border-radius: 6px;
}

.actions button:hover {
  background: #ddd;
}

.footer {
  margin-top: 15px;
  text-align: center;
}

#taskCount {
  margin-bottom: 8px;
  font-size: 14px;
  color: #666;
}

.footer button {
  background: #ff6b6b;
}

.footer button:hover {
  background: #ff4d4d;
}
  </style>
</head>

<body>

<div class="container">
  <h2>📝 To-Do List</h2>

  <input type="text" id="taskInput" placeholder="Enter task">
  <button onclick="addTask()">Add</button>

  <ul id="taskList"></ul>

  <div class="footer">
    <p id="taskCount">0 tasks</p>
    <button onclick="clearAll()">Clear All</button>
  </div>
</div>

<script>
  let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

  const input = document.getElementById("taskInput");

  input.addEventListener("keypress", function(e) {
    if (e.key === "Enter") addTask();
  });

  function showTasks() {
    const list = document.getElementById("taskList");
    const count = document.getElementById("taskCount");

    list.innerHTML = "";

    tasks.forEach((task, index) => {
      const li = document.createElement("li");

      li.innerHTML = `
        <span onclick="toggleTask(${index})" class="${task.done ? 'done' : ''}">
          ${task.text}
        </span>
        <div class="actions">
          <button onclick="editTask(${index})">✏️</button>
          <button onclick="deleteTask(${index})">❌</button>
        </div>
      `;

      list.appendChild(li);
    });

    count.innerText = `${tasks.length} task(s)`;
    localStorage.setItem("tasks", JSON.stringify(tasks));
  }

  function addTask() {
    if (input.value.trim() === "") {
      alert("Enter a task!");
      return;
    }

    tasks.push({ text: input.value, done: false });
    input.value = "";
    showTasks();
  }

  function deleteTask(index) {
    tasks.splice(index, 1);
    showTasks();
  }

  function toggleTask(index) {
    tasks[index].done = !tasks[index].done;
    showTasks();
  }

  function editTask(index) {
    const newText = prompt("Edit your task:", tasks[index].text);
    if (newText !== null && newText.trim() !== "") {
      tasks[index].text = newText;
      showTasks();
    }
  }

  function clearAll() {
    if (confirm("Delete all tasks?")) {
      tasks = [];
      showTasks();
    }
  }

  showTasks();
</script>

</body>
</html>
