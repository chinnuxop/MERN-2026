<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css Transforms</title>
    <style>
        .box {
            height: 50px;
            width: 50px;
            border: 2px solid black;
            background-color: rgb(243, 109, 201);
            /* transform: rotate(40deg); */
             /* transform: rotate(0.25turn); */
             /* transform: rotateX(40deg); */
             /* transform: skew(5deg); */
             transform: translateX(70%) skewX(40deg) translateY(45%);
            display: flex;
            align-items: center;
        }

        .container {
            width: 100vw;
            height: 80vh;
            border: 4px solid red;

        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box">
            I am a Box.
        </div>
    </div>

</body>

</html>
